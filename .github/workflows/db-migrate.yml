# Applies new SQL files in supabase/migrations to the Supabase database.
# Every run waits for Atsuko's approval (environment "supabase" has a required reviewer),
# so nothing changes in the database until she taps "Approve" on GitHub.
name: Database update
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
concurrency: db-migrate
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: supabase
    steps:
      - uses: actions/checkout@v4
      - name: Check the connection secret is set
        env: { DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }
        run: test -n "$DB_URL" || { echo "SUPABASE_DB_URL is not set in the 'supabase' environment"; exit 1; }
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Apply new SQL files (each one in its own transaction)
        env: { DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "create table if not exists public._migrations (name text primary key, applied_at timestamptz not null default now()); alter table public._migrations enable row level security;"
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            done_=$(psql "$DB_URL" -tA -c "select 1 from public._migrations where name = '$n'")
            if [ "$done_" = "1" ]; then echo "already applied: $n"; continue; fi
            echo "applying: $n"
            psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f" -c "insert into public._migrations(name) values ('$n')"
          done
          echo "Database is up to date."
