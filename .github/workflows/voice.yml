name: Make story voices
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Make the narration
        run: |
          sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install -q "kokoro>=0.9.4" soundfile
          mkdir -p assets/voice
          python tools/voices.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/voice && git commit -m "Story narration voices (Kokoro)" && git push
